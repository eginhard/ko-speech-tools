[project]
name = "ko-speech-tools"
version = "0.1.0"
description = "Korean speech/NLP tools"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSES/*.txt", "REUSE.toml"]
authors = [
    { name = "Enno Hermann", email = "enno.hermann@gmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
repository = "https://github.com/eginhard/ko-speech-tools"
issues = "https://github.com/eginhard/ko-speech-tools/issues"

[project.optional-dependencies]
g2p = [
    "mecab-ko>=1.0.2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.10.7",
    "prek>=0.5",
    "pytest>=9",
    "reuse>=6",
    "ruff==0.17.3",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.run]
source = ["src/ko_speech_tools", "tests"]
command_line = "-m pytest"
relative_files = true

[tool.pytest.ini_options]
addopts = "--doctest-modules --doctest-glob=README.md"

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "compare-to-empty-string",
    "complex-structure",
    "missing-trailing-comma",
    "missing-copyright-notice",
    "multiple-leading-hashes-for-block-comment",
    "PLR09",
    "magic-value-comparison",
    "redefined-loop-name",
    "TD",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN",
    "D",
    "DOC",
    "commented-out-code",
    "line-contains-todo",
    "try-except-in-loop",
    "assert"
]

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"
